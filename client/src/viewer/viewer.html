<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; media-src file:; frame-src file: rfm-site:; style-src 'self' 'unsafe-inline'" />
  <title>파일 보기</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header id="titlebar">
    <div class="tab">
      <img id="tab-icon" alt="" />
      <span id="tab-title"></span>
    </div>
  </header>

  <div id="toolbar">
    <div class="group" id="tools-image" hidden>
      <button class="tool icon" id="btn-zoom-out" title="축소 (Ctrl+-)"><i>&#xE71F;</i></button>
      <span id="zoom-label">100%</span>
      <button class="tool icon" id="btn-zoom-in" title="확대 (Ctrl++)"><i>&#xE8A3;</i></button>
      <button class="tool" id="btn-fit" title="창에 맞추기 / 실제 크기 (Ctrl+0)"><i>&#xE9A6;</i><span id="fit-label">실제 크기</span></button>
      <div class="sep"></div>
    </div>
    <div class="group" id="tools-html" hidden>
      <button class="tool" id="btn-mode" title="페이지 미리 보기 / HTML 소스 보기"><i id="mode-glyph">&#xE943;</i><span id="mode-label">소스 보기</span></button>
      <button class="tool icon" id="btn-devtools" title="개발자 도구 (F12)"><i>&#xEC7A;</i></button>
      <div class="sep"></div>
    </div>
    <div class="group" id="tools-text" hidden>
      <button class="tool" id="btn-wrap" title="자동 줄 바꿈 (Alt+Z)"><i>&#xE751;</i><span>자동 줄 바꿈</span></button>
      <button class="tool icon" id="btn-font-out" title="글자 작게 (Ctrl+-)"><i>&#xE8E7;</i></button>
      <button class="tool icon" id="btn-font-in" title="글자 크게 (Ctrl++)"><i>&#xE8E8;</i></button>
      <div class="sep"></div>
    </div>
    <button class="tool" id="btn-external" title="노트북 기본 앱으로 열기 — 저장하면 원격 PC에 반영됩니다"><i>&#xE8A7;</i><span>기본 앱으로 열기</span></button>
    <button class="tool" id="btn-save" title="내 노트북에 저장"><i>&#xE896;</i><span>내 노트북에 저장</span></button>
    <div class="spacer"></div>
    <button class="tool icon" id="btn-reload" title="다시 불러오기 (F5)"><i>&#xE72C;</i></button>
  </div>

  <main id="stage"></main>

  <footer id="status">
    <span id="status-path"></span>
    <span class="spacer"></span>
    <span id="status-info"></span>
  </footer>

  <script src="viewer.js"></script>
</body>
</html>
