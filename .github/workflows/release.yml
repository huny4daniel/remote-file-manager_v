name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: 버전 정보 반영
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($dir in 'client', 'server') {
            Push-Location $dir
            npm version $version --no-git-tag-version --allow-same-version
            Pop-Location
          }

      - name: 의존성 설치
        run: |
          npm ci --prefix client
          npm ci --prefix server

      - name: 노트북용 exe 빌드
        working-directory: client
        env:
          # 코드 서명 인증서가 없으므로 자동 탐색을 끈다
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --publish never

      - name: 집 PC용 서버 exe 빌드
        working-directory: server
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --win portable --publish never

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            client/dist/RemoteFileManager_${{ github.ref_name }}.exe
            server/release/RemoteFileManager-Server_${{ github.ref_name }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 결과물 다운로드
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: 같은 부버전 기존 릴리즈 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # v1.2.3 → 1.2 (major.minor 추출)
          MINOR=$(echo "$TAG" | sed 's/^v//' | cut -d. -f1-2)

          gh release list --repo ${{ github.repository }} --limit 100 \
            --json tagName --jq '.[].tagName' | while read t; do
            TM=$(echo "$t" | sed 's/^v//' | cut -d. -f1-2)
            if [ "$TM" = "$MINOR" ] && [ "$t" != "$TAG" ]; then
              echo "기존 릴리즈 삭제: $t"
              gh release delete "$t" --yes --repo ${{ github.repository }}
            fi
          done

      - name: 릴리즈 생성 및 파일 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/**/RemoteFileManager_${{ github.ref_name }}.exe
            dist/**/RemoteFileManager-Server_${{ github.ref_name }}.exe
